name: Python Code Check

# Chỉ chạy kiểm tra khi có lệnh Push hoặc Pull Request vào branch main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Tải code từ repository về máy máy chủ ảo của GitHub
    - name: Check out repository code
      uses: actions/checkout@v4

    # 2. Cài đặt môi trường Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Cài đặt các thư viện cần thiết (nếu dự án có file requirements.txt)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. Tự động chạy thử file main.py để xem có văng lỗi không
    - name: Run main script test
      run: |
        python main.py